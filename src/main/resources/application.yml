spring:
  application:
    name: airlab
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    schemas: research
    locations: classpath:db/migration
  thymeleaf:
    cache: false
  threads:
    virtual:
      enabled: true

server:
  port: ${AIRLAB_PORT:8080}
  address: ${AIRLAB_BIND:127.0.0.1}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# Logs estruturados sem dado pessoal (Constitution P6).
logging:
  level:
    root: INFO
    io.github.rogeriocisi.airlab: INFO
    org.hibernate.SQL: WARN

airlab:
  # P4 (SPEC E13): quem recebe os avisos de etapa concluida, o contato humano mostrado na
  # inscricao (E10, trava 5) e o remetente dos e-mails. O SMTP em si vem das variaveis
  # SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME e SPRING_MAIL_PASSWORD.
  admin-email: ${AIRLAB_ADMIN_EMAIL:}
  contact-email: ${AIRLAB_CONTACT_EMAIL:}
  mail-from: ${AIRLAB_MAIL_FROM:crivo@localhost}
  # Endereco publico do site, para os links dos e-mails enviados fora de uma requisicao (o aviso
  # de pedido novo ao medium sai do ciclo do servidor).
  base-url: ${AIRLAB_BASE_URL:http://localhost:8080}
  p4:
    # Referencia da aprovacao do comite de etica (CEP/Plataforma Brasil). Sem ela, em producao,
    # o formulario de pedido do P4 fica fechado (SPEC E10, trava 4; E13, fase B).
    cep-reference: ${AIRLAB_CEP_REFERENCE:}
    # Ciclo automatico do P4 (E13, fase C): pareamento, envio ao medium, prazos e reenvio.
    cycle-enabled: true
    cycle-ms: 60000
    # Questionario marcado como rascunho so congela no perfil local (E13, fase C).
    allow-draft-questionnaire: false
  storage:
    path: ${AIRLAB_STORAGE_PATH:./data/media}
  # Ancoragem externa da trilha por carimbo de tempo RFC 3161 (SPEC E8, v0.15). So o hash da cabeca
  # da trilha sai do servidor. Os certificados ficam no repositorio e sao conferidos contra o SHA-256
  # publicado pela autoridade (freetsa.org) antes de qualquer uso.
  timestamp:
    enabled: ${AIRLAB_TIMESTAMP_ENABLED:true}
    authority: FreeTSA
    url: ${AIRLAB_TIMESTAMP_URL:https://freetsa.org/tsr}
    tsa-certificate: classpath:timestamp/freetsa/tsa.crt
    tsa-certificate-sha256: 8bfb0305bb64e2571ca507552ef3245cb1c2fee8728e0ff8689225081ea13467
    ca-certificate: classpath:timestamp/freetsa/cacert.pem
    ca-certificate-sha256: 2151b61137ffa86bf664691ba67e7da0b19f98c758e3d228d5d8ebf27e044438
    # Marcos (congelamento, emenda, semente revelada, relatorio) sao carimbados na verificacao seguinte;
    # fora deles, uma trilha que mudou e carimbada a cada intervalo.
    interval: PT24H
    retry-after: PT15M
    timeout: PT20S
    check-ms: 60000
  identity:
    # Chave AES-256 em Base64 para os campos do esquema identity (LGPD, P6).
    # Em producao vem do ambiente; sem ela a aplicacao nao inicia no perfil prod.
    encryption-key: ${AIRLAB_IDENTITY_KEY:}
  local-database:
    enabled: false
    port: 5433
    data-directory: ${user.home}/.airlab/pgdata
